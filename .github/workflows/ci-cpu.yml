name: CPU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: python -m pip install flake8

      - name: Run flake8
        run: flake8

      - name: Run cpplint
        run: python scripts/cpplint.py

      - name: Check license headers
        run: python scripts/check_license.py

      - name: Check inline samples are up to date
        run: python test/tools/inline_samples.py --check

  build:
    name: Build CPU Wheel (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CUTILE_BUILD_VARIANT: cpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld g++

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install CPU build dependencies
        run: uv sync --group cpu --no-install-project

      - name: Build CPU wheel
        run: uv build --wheel --no-build-isolation --python .venv/bin/python

      - name: Upload CPU wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheel-cpu-py3.12-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  test-cpu:
    name: CPU Tests (Python 3.12)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download CPU wheel
        uses: actions/download-artifact@v7
        with:
          name: wheel-cpu-py3.12-linux-x86_64
          path: dist/

      - name: Install test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl numpy pytest pytest-benchmark pytest-env
          python -m pip install setuptools==84.0.0 'cmake>=3.24,<4' ninja

      - name: Run CPU backend tests
        run: python -m pytest --durations=10 --junitxml=test-results.xml -m "not benchmark" backends/cpu backends/test

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: cpu-test-results
          path: test-results.xml
          retention-days: 7